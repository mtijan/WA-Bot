        '404': { $ref: '#/components/responses/Error' }
  /monitoring/status:
    get:
      tags: [Monitoring]
      summary: Get dashboard monitoring status
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /monitoring/repair-logs:
    get:
