        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /plans:
    get:
      tags: [Plans]
      summary: List subscription plans
      description: Admin-only management endpoint for SaaS device, campaign, and chatbot-flow quotas.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Plans]
      summary: Create a subscription plan
      description: Admin-only. If is_default is true, existing default plans are unset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, max_sessions, max_campaigns_per_month, max_flows]
              properties:
                name: { type: string }
                max_sessions: { type: integer, minimum: 0 }
                max_campaigns_per_month: { type: integer, minimum: 0 }
                max_flows: { type: integer, minimum: 0 }
                is_default: { type: boolean }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /plans/{id}:
    put:
      tags: [Plans]
      summary: Update a subscription plan
      description: Admin-only. Cannot bypass user entitlement checks; runtime quota enforcement reads the current plan values.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, max_sessions, max_campaigns_per_month, max_flows]
              properties:
                name: { type: string }
                max_sessions: { type: integer, minimum: 0 }
                max_campaigns_per_month: { type: integer, minimum: 0 }
                max_flows: { type: integer, minimum: 0 }
                is_default: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Plans]
      summary: Delete a subscription plan
      description: Admin-only. Plans assigned to existing users cannot be deleted.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /audit-logs:
    get:
      tags: [Audit Logs]
      summary: List audit log entries
      description: Admins can view all audit events; regular users can only view events where they are the actor.
      parameters:
        - name: event_type
          in: query
          schema: { type: string }
        - name: target_type
          in: query
          schema: { type: string }
        - name: result
          in: query
          schema: { type: string, enum: [success, failure] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
