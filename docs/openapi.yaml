components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: wa_bot_access
      description: HttpOnly JWT access cookie issued by /auth/login. Refresh rotation uses the separate HttpOnly wa_bot_refresh cookie on /api/auth/refresh.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Enabled when WA_BOT_API_KEY is configured on the backend.
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Shared secret for localhost/private internal process control API.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Success:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Envelope:
      type: object
      properties:
        status: { type: string, example: success }
        data: {}
        message: { type: string }
    Error:
      type: object
      properties:
        status: { type: string, example: error }
        message: { type: string }
