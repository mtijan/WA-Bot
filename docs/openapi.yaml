openapi: 3.0.3
info:
  title: WA-Bot Pro Local API
  version: 2.9.7
  description: |
    Machine-readable baseline for the routes mounted by the local Express backend.
    Rate limiting and restricted CORS origins are enforced by the local backend.
    Configure WA_BOT_ADMIN_PASSWORD to require admin cookie login for browser access.
    X-API-Key remains available for trusted server-to-server access when WA_BOT_API_KEY is configured.
servers:
  - url: http://localhost:3001/api
    description: Local development backend
security:
  - AdminSession: []
  - ApiKeyAuth: []
tags:
  - name: Auth
  - name: User Management
  - name: Sessions
  - name: Campaigns
  - name: Contacts
  - name: Templates
  - name: Chatbot Flows
  - name: Auto Replies
  - name: Warmer
  - name: Single Message
  - name: Group Grabber
  - name: Proxies
  - name: Chatbot AI
  - name: Opt Outs
  - name: Uploads
  - name: Monitoring
  - name: Plans
  - name: Audit Logs
  - name: Internal Process API
paths:
  /auth/me:
    get:
      tags: [Auth]
      summary: Get admin authentication status
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Login to the admin dashboard
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Clear the admin session cookie
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue a fresh access cookie
      security: []
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /users:
    get:
      tags: [User Management]
      summary: List dashboard users
      description: Admin-only. Returns users without password hashes or refresh tokens.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [User Management]
      summary: Create a dashboard user
      description: Admin-only. Passwords must be at least 12 characters and are stored as bcrypt hashes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string, minLength: 3, maxLength: 30, pattern: '^[a-zA-Z0-9_.-]+$' }
                password: { type: string, format: password, minLength: 12, maxLength: 100 }
                display_name: { type: string, maxLength: 100 }
                role: { type: string, enum: [admin, user] }
                device_limit: { type: integer, minimum: 0, maximum: 100, default: 1 }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /users/{id}:
    patch:
      tags: [User Management]
      summary: Update a dashboard user profile, role, or active status
      description: Admin-only. Role or active-status changes revoke existing sessions through token_version.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, maxLength: 100 }
                role: { type: string, enum: [admin, user] }
                is_active: { type: integer, enum: [0, 1] }
                device_limit: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [User Management]
      summary: Deactivate a dashboard user
      description: Admin-only. The user is soft-deleted by setting is_active=0 and revoking active sessions.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /users/{id}/password:
    patch:
      tags: [User Management]
      summary: Change a dashboard user password
      description: Users may change their own password with the old password; admins may reset another user password. Password changes revoke existing sessions.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                old_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 12, maxLength: 100 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /sessions:
    get:
      tags: [Sessions]
      summary: List WhatsApp sessions
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Sessions]
      summary: Create or initialize a WhatsApp session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
                  description: Filesystem-safe session identifier; path separators, dots, and whitespace are rejected.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
  /sessions/{id}:
    delete:
      tags: [Sessions]
      summary: Delete a session
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /sessions/{id}/proxy:
    patch:
      tags: [Sessions]
      summary: Assign or clear a session proxy
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /sessions/{id}/repair:
    post:
      tags: [Sessions]
      summary: Manually repair a disconnected or corrupted session
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /sessions/{id}/reconnect:
    post:
      tags: [Sessions]
      summary: Manually reconnect a WhatsApp session
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /campaigns:
    get:
      tags: [Campaigns]
      summary: List bulk campaigns
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Campaigns]
      summary: Create a bulk campaign
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '202': { $ref: '#/components/responses/Success' }
  /campaigns/{id}:
    get:
      tags: [Campaigns]
      summary: Get campaign progress and logs
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Campaigns]
      summary: Delete a campaign
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /contacts:
    get:
      tags: [Contacts]
      summary: List contacts
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Contacts]
      summary: Create a contact
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /contacts/groups:
    get:
      tags: [Contacts]
      summary: List contact groups
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Contacts]
      summary: Create a contact group
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /contacts/groups/{id}:
    put:
      tags: [Contacts]
      summary: Update a contact group
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Contacts]
      summary: Delete a contact group
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /contacts/{id}:
    put:
      tags: [Contacts]
      summary: Update a contact
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Contacts]
      summary: Delete a contact
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /contacts/bulk:
    post:
      tags: [Contacts]
      summary: Create contacts in bulk
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /contacts/import/preview:
    post:
      tags: [Contacts]
      summary: Preview and validate a Sheet1 XLSX or CSV contact import
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, group_id]
              properties:
                file:
                  type: string
                  format: binary
                group_id:
                  type: integer
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /contacts/import:
    post:
      tags: [Contacts]
      summary: Import Sheet1 XLSX or CSV contacts with named custom variables
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, group_id]
              properties:
                file:
                  type: string
                  format: binary
                group_id:
                  type: integer
                duplicate_mode:
                  type: string
                  enum: [update, skip]
                  default: update
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /contacts/cleanup:
    post:
      tags: [Contacts]
      summary: Remove orphaned contacts
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /contacts/groups/{groupId}/invalid:
    delete:
      tags: [Contacts]
      summary: Delete invalid contacts in a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /contacts/groups/{groupId}/verify:
    post:
      tags: [Contacts]
      summary: Verify contacts in a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /templates:
    get:
      tags: [Templates]
      summary: List message templates
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Templates]
      summary: Create a message template
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /templates/{id}:
    delete:
      tags: [Templates]
      summary: Delete a message template
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /chatbot-flows:
    get:
      tags: [Chatbot Flows]
      summary: List chatbot flows
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Chatbot Flows]
      summary: Create a chatbot flow
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '201': { $ref: '#/components/responses/Success' }
  /chatbot-flows/export:
    get:
      tags: [Chatbot Flows]
      summary: Export chatbot flows
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /chatbot-flows/import:
    post:
      tags: [Chatbot Flows]
      summary: Import chatbot flows
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /chatbot-flows/{id}:
    get:
      tags: [Chatbot Flows]
      summary: Get chatbot flow detail with nodes
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Chatbot Flows]
      summary: Update a chatbot flow
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Chatbot Flows]
      summary: Delete a chatbot flow
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /chatbot-flows/{id}/status:
    patch:
      tags: [Chatbot Flows]
      summary: Update chatbot flow status
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /chatbot-flows/{id}/settings:
    patch:
      tags: [Chatbot Flows]
      summary: Update chatbot flow settings without resending nodes
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
  /auto-replies:
    get:
      tags: [Auto Replies]
      summary: List auto-reply rules
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Auto Replies]
      summary: Create an auto-reply rule
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auto-replies/{id}:
    put:
      tags: [Auto Replies]
      summary: Update an auto-reply rule
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Auto Replies]
      summary: Delete an auto-reply rule
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /warmer/templates:
    get:
      tags: [Warmer]
      summary: List warmer templates
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Warmer]
      summary: Create a warmer template
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /warmer/templates/{id}:
    delete:
      tags: [Warmer]
      summary: Delete a warmer template
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /warmer/campaigns:
    get:
      tags: [Warmer]
      summary: List warmer campaigns
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Warmer]
      summary: Start a warmer campaign
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '201': { $ref: '#/components/responses/Success' }
  /warmer/campaigns/{id}:
    delete:
      tags: [Warmer]
      summary: Delete a warmer campaign
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /warmer/campaigns/{id}/stop:
    post:
      tags: [Warmer]
      summary: Stop a warmer campaign
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /warmer/campaigns/{id}/logs:
    get:
      tags: [Warmer]
      summary: Get warmer campaign logs
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /single-message/groups/{sessionId}:
    get:
      tags: [Single Message]
      summary: List groups for single-message sending
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /single-message/send:
    post:
      tags: [Single Message]
      summary: Send a single message
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /group-grabber/groups/{sessionId}:
    get:
      tags: [Group Grabber]
      summary: List WhatsApp groups for a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /group-grabber/export-participants:
    post:
      tags: [Group Grabber]
      summary: Export group participants as CSV
      responses:
        '200':
          description: CSV export
          content:
            text/csv:
              schema: { type: string, format: binary }
  /group-grabber/invite-link:
    post:
      tags: [Group Grabber]
      summary: Get a group invite link
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /group-grabber/force-sync-contacts:
    post:
      tags: [Group Grabber]
      summary: Force contact synchronization
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /proxies:
    get:
      tags: [Proxies]
      summary: List proxies
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Proxies]
      summary: Create a proxy configuration
      description: Admin-only. Proxy credentials are masked in subsequent responses.
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /proxies/{id}:
    delete:
      tags: [Proxies]
      summary: Delete a proxy
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /proxies/{id}/test:
    post:
      tags: [Proxies]
      summary: Test a proxy connection
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /proxies/settings/{key}:
    get:
      tags: [Proxies]
      summary: Get a proxy-related setting
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Proxies]
      summary: Save a proxy-related setting
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /proxies/offline-db/status:
    get:
      tags: [Proxies]
      summary: Get offline IPLocate database status
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /proxies/offline-db/download:
    post:
      tags: [Proxies]
      summary: Start downloading offline IPLocate databases
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /chatbot-ai/settings/{sessionId}:
    get:
      tags: [Chatbot AI]
      summary: Get Chatbot AI settings
      description: The response omits the stored provider key and returns has_api_key metadata.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /chatbot-ai/settings:
    post:
      tags: [Chatbot AI]
      summary: Save Chatbot AI settings
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /chatbot-ai/test:
    post:
      tags: [Chatbot AI]
      summary: Test an AI provider connection
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /chatbot-ai/credentials:
    get:
      tags: [Chatbot AI]
      summary: List Chatbot AI provider credentials
      description: Non-admin users only see credentials in their tenant; API keys are masked.
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Chatbot AI]
      summary: Create a Chatbot AI provider credential
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
  /chatbot-ai/credentials/{id}:
    put:
      tags: [Chatbot AI]
      summary: Update a Chatbot AI provider credential
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Chatbot AI]
      summary: Delete a Chatbot AI provider credential
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /chatbot-ai/credentials/{id}/toggle:
    patch:
      tags: [Chatbot AI]
      summary: Toggle a Chatbot AI provider credential active status
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /opt-outs:
    get:
      tags: [Opt Outs]
      summary: List suppressed recipients
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Opt Outs]
      summary: Add a recipient to the suppression list
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /opt-outs/{phoneNumber}:
    delete:
      tags: [Opt Outs]
      summary: Remove a recipient from the suppression list
      parameters:
        - name: phoneNumber
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /uploads/media:
    post:
      tags: [Uploads]
      summary: Upload an authenticated media attachment
      description: Accepts images up to 5 MB, videos up to 10 MB, audio up to 2 MB, and documents up to 5 MB. Uploaded files are runtime data and remain behind authenticated /api access.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [media]
              properties:
                media:
                  type: string
                  format: binary
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /uploads/media/{filename}:
    get:
      tags: [Uploads]
      summary: Download an uploaded media file
      description: Requires authentication. The current implementation only allows the authenticated owner of the uploaded media to download the file.
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Binary media file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Uploads]
      summary: Delete an uploaded media file
      description: Requires authentication. The current implementation only allows the authenticated owner of the uploaded media to delete the file and remove its metadata.
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
